<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BLER ERP · Marca</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Montserrat, 'Segoe UI', sans-serif; background: #F8F7FF; color: #1E1B4B; }
  section { padding: 40px; display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .dark { background: #0F0D24; }
  img { max-width: 100%; }
  .swatches { display: flex; gap: 12px; padding: 0 40px 40px; flex-wrap: wrap; }
  .swatches div { width: 120px; height: 72px; border-radius: 12px; color: #fff; font-size: 12px; padding: 8px; box-sizing: border-box; display: flex; align-items: flex-end; }
</style>
</head>
<body>
  <section><img src="bler_logo_horizontal.svg" width="520"><img src="bler_icon.svg" width="128"><img src="bler_icon.svg" width="48"><img src="bler_icon.svg" width="24"></section>
  <section class="dark"><img src="bler_logo_horizontal_dark.svg" width="520"><img src="bler_icon.svg" width="128"></section>
  <section style="background:repeating-linear-gradient(45deg,#FDE68A 0 24px,#FFFFFF 24px 48px)"><img src="bler_icon.svg" width="160"><img src="bler_logo_horizontal.svg" width="520"></section>
  <section><strong>Paleta</strong></section>
  <div class="swatches">
    <div style="background:#1E1B4B">#1E1B4B Índigo noche</div>
    <div style="background:#6D28D9">#6D28D9 Violeta hechizo</div>
    <div style="background:#8B5CF6">#8B5CF6 Amatista</div>
    <div style="background:#22D3EE;color:#1E1B4B">#22D3EE Cian cristal</div>
  </div>
</body>
</html>
