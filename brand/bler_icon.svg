<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>BLER ERP</title>
  <defs>
    <!-- Cuerpo del cristal: índigo profundo → violeta → cian, translúcido (deja ver el fondo) -->
    <linearGradient id="gem" x1="40" y1="236" x2="216" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.82"/>
      <stop offset="0.4" stop-color="#6D28D9" stop-opacity="0.62"/>
      <stop offset="0.72" stop-color="#8B5CF6" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.58"/>
    </linearGradient>
    <!-- Canto del cristal: brillante arriba a la izquierda, cian abajo a la derecha -->
    <linearGradient id="rim" x1="31" y1="16" x2="225" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Reflejo diagonal (refracción) -->
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hex">
      <path d="M128 16 L225 72 L225 184 L128 240 L31 184 L31 72 Z"/>
    </clipPath>
    <!-- Brillo superior del cristal -->
    <linearGradient id="gloss" x1="128" y1="16" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Barras: vidrio blanco que se desvanece hacia la base -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="162" cy="60" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gema hexagonal -->
  <path d="M128 16 L225 72 L225 184 L128 240 L31 184 L31 72 Z" fill="url(#gem)" stroke-linejoin="round"/>

  <!-- Facetas cristalinas (triángulos desde el centro) -->
  <g fill="#FFFFFF">
    <path d="M128 16 L225 72 L128 128 Z" opacity="0.16"/>
    <path d="M225 72 L225 184 L128 128 Z" opacity="0.05"/>
    <path d="M225 184 L128 240 L128 128 Z" opacity="0.02"/>
    <path d="M128 240 L31 184 L128 128 Z" opacity="0"/>
    <path d="M31 184 L31 72 L128 128 Z" opacity="0.08"/>
    <path d="M31 72 L128 16 L128 128 Z" opacity="0.22"/>
  </g>
  <path d="M128 16 L225 72 L225 184 L128 240 L31 184 L31 72 Z" fill="url(#gloss)" opacity="0.6"/>

  <!-- Aristas internas vistas a través del cristal -->
  <g stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3" fill="none">
    <path d="M128 16 L128 128 M225 72 L128 128 M225 184 L128 128 M128 240 L128 128 M31 184 L128 128 M31 72 L128 128"/>
    <path d="M128 29 L213 78 L213 177 L128 227 L43 177 L43 78 Z" stroke-opacity="0.22"/>
  </g>

  <!-- Reflejo diagonal recortado a la gema -->
  <g clip-path="url(#hex)">
    <path d="M20 118 L118 4 L150 4 L52 118 Z" fill="url(#streak)"/>
    <path d="M60 150 L170 22 L182 22 L72 150 Z" fill="url(#streak)" opacity="0.6"/>
  </g>

  <!-- Canto del cristal -->
  <path d="M128 16 L225 72 L225 184 L128 240 L31 184 L31 72 Z" fill="none" stroke="url(#rim)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Resplandor de la chispa -->
  <circle cx="162" cy="60" r="40" fill="url(#glow)"/>

  <!-- Barras de crecimiento (ámbito empresarial) -->
  <rect x="78"  y="140" width="28" height="44" rx="6" fill="url(#bar)"/>
  <rect x="113" y="114" width="28" height="70" rx="6" fill="url(#bar)"/>
  <rect x="148" y="88"  width="28" height="96" rx="6" fill="url(#bar)"/>

  <!-- Chispa mágica de cuatro puntas sobre la barra más alta -->
  <path d="M162 38 C164 52 168 56 182 58 C168 60 164 64 162 78 C160 64 156 60 142 58 C156 56 160 52 162 38 Z" fill="#FFFFFF"/>
  <!-- Chispa secundaria -->
  <path d="M96 94 C97 101 99 103 106 104 C99 105 97 107 96 114 C95 107 93 105 86 104 C93 103 95 101 96 94 Z" fill="#FFFFFF" opacity="0.8"/>
</svg>
